services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-content}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-content}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-content} -d ${POSTGRES_DB:-content}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["future-queue"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-content}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-content}
      # Al aprobar un video, la API lo encola a traves del publisher-service.
      # Dentro de la red de Docker se llama por su nombre de servicio.
      PUBLISHER_BASE_URL: ${PUBLISHER_BASE_URL:-http://publisher:8001}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ../apps/dashboard
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_MIXPOST_URL: ${NEXT_PUBLIC_MIXPOST_URL:-http://localhost:3002/mixpost}
        NEXT_PUBLIC_OPEN_DISPATCH_URL: ${NEXT_PUBLIC_OPEN_DISPATCH_URL:-http://localhost:8010}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - api

  # Publisher: encola la publicacion en el scheduler configurado.
  #   PUBLISHER_BACKEND=open_dispatch (por defecto) -> Open-Dispatch
  #   PUBLISHER_BACKEND=mixpost                     -> Mixpost (API Pro/Cloud)
  publisher:
    profiles: ["publisher"]
    build:
      context: ../apps/publisher-service
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      PUBLISHER_BACKEND: ${PUBLISHER_BACKEND:-open_dispatch}
      # Desde la red de Docker el scheduler se llama por su nombre de
      # servicio, no por localhost:8010 (que dentro del contenedor es el
      # propio publisher).
      OPEN_DISPATCH_BASE_URL: http://open-dispatch:8000
      OPEN_DISPATCH_API_TOKEN: ${OPEN_DISPATCH_API_TOKEN:-}
      # Volumen de medios compartido con Open-Dispatch: YouTube sube el MP4
      # desde disco y exige una ruta RELATIVA bajo OPEN_DISPATCH_MEDIA_DIR.
      # La ruta debe ser IDENTICA en los dos contenedores.
      OPEN_DISPATCH_MEDIA_DIR: /media
      MIXPOST_BASE_URL: http://mixpost/mixpost/api
    volumes:
      - open_dispatch_media:/media
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - api

  worker-gateway:
    image: nginx:1.27-alpine
    profiles: ["colab-tunnel"]
    volumes:
      - ./worker-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8002:8080"
    depends_on:
      - api

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["colab-tunnel"]
    command: tunnel --no-autoupdate --url http://worker-gateway:8080
    depends_on:
      - worker-gateway

  # Open-Dispatch (MIT): scheduler de publicacion para TikTok, Instagram y
  # YouTube. Se construye desde el repositorio oficial, fijado a un commit
  # concreto para que el despliegue sea reproducible.
  #   https://github.com/Matthew-Selvam/Open-Dispatch
  # Nota sobre la cola: sin DATABASE_URL ni REDIS_URL, Open-Dispatch usa su
  # backend JSONL, que upstream documenta como "single-process" (el lock es un
  # threading.Lock, no protege entre el proceso API y el worker). Es el mismo
  # despliegue de referencia del proyecto upstream y funciona en uso normal, pero
  # para carga alta conviene extender la imagen con psycopg2-binary y definir
  # DATABASE_URL: el backend Postgres usa SELECT ... FOR UPDATE SKIP LOCKED sobre
  # la tabla open_dispatch_queue y si admite varios procesos.
  open-dispatch:
    profiles: ["dispatch"]
    build:
      context: https://github.com/Matthew-Selvam/Open-Dispatch.git#773dd54d4cec24a5995d8c722e9f02545cfba013
    environment:
      OPEN_DISPATCH_API_TOKEN: ${OPEN_DISPATCH_API_TOKEN:-}
      OPEN_DISPATCH_MEDIA_DIR: /media
      OPEN_DISPATCH_DATA: /data
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      TIKTOK_PRIVACY_LEVEL: ${TIKTOK_PRIVACY_LEVEL:-PUBLIC_TO_EVERYONE}
      IG_USER_ID: ${IG_USER_ID:-}
      IG_TOKEN: ${IG_TOKEN:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - open_dispatch_data:/data
      - open_dispatch_media:/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  open-dispatch-worker:
    profiles: ["dispatch"]
    build:
      context: https://github.com/Matthew-Selvam/Open-Dispatch.git#773dd54d4cec24a5995d8c722e9f02545cfba013
    environment:
      OPEN_DISPATCH_API_TOKEN: ${OPEN_DISPATCH_API_TOKEN:-}
      OPEN_DISPATCH_MEDIA_DIR: /media
      OPEN_DISPATCH_DATA: /data
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      TIKTOK_PRIVACY_LEVEL: ${TIKTOK_PRIVACY_LEVEL:-PUBLIC_TO_EVERYONE}
      IG_USER_ID: ${IG_USER_ID:-}
      IG_TOKEN: ${IG_TOKEN:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
    command: ["python", "-m", "scheduler.worker"]
    # La imagen de upstream trae un HEALTHCHECK que consulta el puerto 8000, pero
    # el worker no sirve HTTP (solo consume la cola), asi que el chequeo siempre
    # falla y Docker lo marca "unhealthy" aunque el proceso este bien. Se
    # desactiva: la salud real del worker se ve en sus logs.
    healthcheck:
      disable: true
    volumes:
      - open_dispatch_data:/data
      - open_dispatch_media:/media
    depends_on:
      open-dispatch:
        condition: service_healthy

  # Mixpost (MIT en Lite) queda como scheduler ALTERNATIVO: su API REST solo
  # esta disponible en Mixpost Pro o Cloud. Para usarlo hay que activar el
  # perfil "scheduler" y poner PUBLISHER_BACKEND=mixpost.
  mixpost:
    image: inovector/mixpost:latest
    profiles: ["scheduler"]
    environment:
      APP_NAME: Marketing Content OS
      APP_KEY: ${MIXPOST_APP_KEY:?Define MIXPOST_APP_KEY en .env}
      APP_DEBUG: "false"
      APP_DOMAIN: ${MIXPOST_DOMAIN:-localhost:3002}
      APP_URL: ${MIXPOST_URL:-http://localhost:3002}
      # Mixpost Lite sirve la API (y la UI) bajo este prefijo:
      # http://host:3002/mixpost/api/...
      MIXPOST_CORE_PATH: ${MIXPOST_CORE_PATH:-mixpost}
      DB_HOST: mixpost-mysql
      DB_PORT: 3306
      DB_DATABASE: ${MIXPOST_DB_NAME:-mixpost}
      DB_USERNAME: ${MIXPOST_DB_USER:-mixpost}
      DB_PASSWORD: ${MIXPOST_DB_PASSWORD:?Define MIXPOST_DB_PASSWORD en .env}
      REDIS_HOST: mixpost-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: null
      MIXPOST_DISK: public
    ports:
      - "127.0.0.1:3002:80"
    volumes:
      - mixpost_storage:/var/www/html/storage/app
      - mixpost_logs:/var/www/html/storage/logs
    depends_on:
      mixpost-mysql:
        condition: service_healthy
      mixpost-redis:
        condition: service_healthy

  mixpost-mysql:
    image: mysql/mysql-server:8.0
    profiles: ["scheduler"]
    environment:
      MYSQL_DATABASE: ${MIXPOST_DB_NAME:-mixpost}
      MYSQL_USER: ${MIXPOST_DB_USER:-mixpost}
      MYSQL_PASSWORD: ${MIXPOST_DB_PASSWORD:?Define MIXPOST_DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MIXPOST_DB_ROOT_PASSWORD:?Define MIXPOST_DB_ROOT_PASSWORD en .env}
    volumes:
      - mixpost_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 20s
      retries: 10

  mixpost-redis:
    image: redis:7-alpine
    profiles: ["scheduler"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  mixpost_storage:
  mixpost_logs:
  mixpost_mysql:
  open_dispatch_data:
  open_dispatch_media:
