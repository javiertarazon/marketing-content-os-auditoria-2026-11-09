# Gateway de los workers (Colab -> API).
#
# ATENCION: este gateway se publica a Internet con un Quick Tunnel de
# Cloudflare ("cloudflared tunnel --url") y SIN Cloudflare Access delante: es
# un servicio publico. Por eso se limitan el ritmo y las conexiones, se acotan
# los tiempos de espera y el tamano del cuerpo de la peticion.
#
# Las zonas de limitacion se declaran en el contexto 'http': este fichero se
# monta en /etc/nginx/conf.d/default.conf, que nginx incluye dentro de 'http'.
#   - 120 peticiones/minuto por IP: los workers sonean la cola cada 5 s
#     (12 peticiones/minuto cada uno), asi que el limite deja margen para
#     varios workers a la vez y corta de golpe a quien inunde el gateway.
#   - 8 conexiones simultaneas por IP.
limit_req_zone $binary_remote_addr zone=worker_req:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=worker_conn:10m;

server {
    listen 8080;
    server_name _;

    # Limite de la API: MAX_ASSET_BYTES = 250 MB (apps/api/settings.py).
    client_max_body_size 250m;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;

    # El trafico llega desde el contenedor cloudflared, que anade la cabecera
    # CF-Connecting-IP con la IP real del cliente. Con real_ip, el rate
    # limiting se cuenta por IP real y no por la del tunel (que es la misma
    # para todos los workers). Solo se confian las redes privadas de Docker.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Resolutor DNS de Docker (127.0.0.11). Al meter el nombre del upstream en
    # una variable, nginx lo resuelve en cada peticion en lugar de fijarlo al
    # cargar la configuracion: si la API se recrea y cambia de IP
    # ("docker compose up -d --force-recreate api"), el gateway no se queda
    # apuntando a la IP vieja y devolviendo 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;

    # Sonda de vida del gateway: la usan el healthcheck del compose y el
    # arranque de cloudflared, que espera a que el gateway escuche.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /v1/jobs/next {
        limit_except POST {
            deny all;
        }
        limit_req zone=worker_req burst=60 nodelay;
        limit_conn worker_conn 8;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /v1/workers/heartbeat {
        limit_except POST {
            deny all;
        }
        limit_req zone=worker_req burst=60 nodelay;
        limit_conn worker_conn 8;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ~ ^/v1/jobs/[-a-fA-F0-9]+/(complete|fail|heartbeat|progress)$ {
        limit_except POST {
            deny all;
        }
        limit_req zone=worker_req burst=60 nodelay;
        limit_conn worker_conn 8;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
