server {
    listen 8080;
    server_name _;

    location = /v1/jobs/next {
        limit_except POST {
            deny all;
        }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /v1/workers/heartbeat {
        limit_except POST {
            deny all;
        }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/v1/jobs/[-a-fA-F0-9]+/(complete|fail|heartbeat|progress)$ {
        limit_except POST {
            deny all;
        }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
