services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: ["db"]
    environment:
      # Los defaults coinciden con los de la DATABASE_URL de la API (abajo) y con
      # el .env.example: si no, el rol que crea postgres no es el que pide la
      # API y el stack no levanta sin .env.
      POSTGRES_USER: ${POSTGRES_USER:-content}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-content}
      POSTGRES_DB: ${POSTGRES_DB:-content}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-content}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # MinIO elimino sus repositorios de Docker Hub el 11-09-2026: 'minio/minio'
    # y 'minio/mc' responden 401 (pull denied) y el stack no levanta en una
    # maquina limpia. Se usa el build de la comunidad 'pgsty', que sigue
    # publicado, es multi-arch (amd64/arm64) y expone la misma API.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    networks: ["edge"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Crea el bucket de medios una sola vez. Sin esto, la primera subida falla
  # con NoSuchBucket.
  minio-init:
    # Mismo motivo que el servicio 'minio': 'minio/mc' ya no existe en Docker Hub.
    image: pgsty/mc:RELEASE.2026-11-09T00-00-00Z
    networks: ["edge"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-content-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      echo 'bucket $$S3_BUCKET listo'
      "

  api:
    build:
      # El contexto es la raiz del repositorio: el Dockerfile copia
      # packages/python/core, que vive fuera de apps/api.
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      # El stack de desarrollo siempre habla con MinIO. Los valores S3_* del
      # .env apuntan a R2 de produccion y se ignoran aqui a proposito.
      S3_ENDPOINT_URL: ${DEV_S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${DEV_S3_BUCKET:-content-media}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # La URL se respeta tal cual si viene en el .env: interpolar la contrasena
      # dentro de la URL la rompe si lleva '@', '/' o ':'. El valor compuesto es
      # solo el respaldo para cuando no hay DATABASE_URL definida.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-content}:${POSTGRES_PASSWORD:-content}@postgres:5432/${POSTGRES_DB:-content}}
    networks: ["edge", "db"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Hot reload sin perder el paquete core copiado en la imagen.
      - ./apps/api:/app
      - ./packages/python/core:/app/core
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/dashboard:/app
      # Volume anonimo para conservar node_modules instalado en la imagen.
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks: ["edge"]

networks:
  # Red de servicio (API, dashboard y almacenamiento local).
  edge:
  # Red de datos (solo el postgres de desarrollo).
  db:

volumes:
  pgdata:
  minio-data:
